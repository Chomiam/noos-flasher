<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c71d8"/>
      <stop offset="0.55" stop-color="#3b5bdb"/>
      <stop offset="1" stop-color="#9141ac"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe4f2"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f5f4"/>
      <stop offset="1" stop-color="#b8bcc8"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0b1220" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g transform="rotate(-18 256 256)">
    <g filter="url(#shadow)">
      <!-- Connecteur USB -->
      <rect x="336" y="238" width="92" height="84" rx="14" fill="url(#metal)"/>
      <rect x="352" y="258" width="60" height="7" rx="3.5" fill="#6e6d78"/>
      <rect x="352" y="278" width="60" height="7" rx="3.5" fill="#6e6d78"/>
      <rect x="352" y="298" width="60" height="7" rx="3.5" fill="#6e6d78"/>

      <!-- Corps de la clé USB -->
      <rect x="132" y="196" width="214" height="168" rx="34" fill="url(#body)"/>
      <rect x="132" y="196" width="214" height="168" rx="34" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>

      <!-- Voyant d'activité -->
      <circle cx="170" cy="234" r="12" fill="#33d17a"/>
      <circle cx="170" cy="234" r="5" fill="#8ff0a4"/>

      <!-- Éclair de flashage -->
      <path d="M270 226 L214 300 L250 300 L232 352 L296 270 L258 270 Z" fill="url(#bolt)"/>

      <!-- Attache -->
      <circle cx="164" cy="326" r="15" fill="url(#bg)"/>
      <circle cx="164" cy="326" r="7" fill="#ffffff" fill-opacity="0.92"/>
    </g>
  </g>
</svg>
