[package]
name = "noos-flasher"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
authors = ["Chomiam <chomiam@users.noreply.github.com>"]
description = "Créateur de clés USB bootables Linux (DD) et Windows 10/11 UEFI avec studio de debloat, en GTK4 / Libadwaita"
license = "MIT"
repository = "https://github.com/Chomiam/noos-flasher"
homepage = "https://github.com/Chomiam/noos-flasher"
readme = "README.md"
keywords = ["gtk4", "libadwaita", "usb", "flasher", "windows"]
categories = ["gui", "utility", "os::linux-apis"]
default-run = "noos-flasher"

[[bin]]
name = "noos-flasher"
path = "src/main.rs"

[dependencies]
gtk = { version = "0.9.6", package = "gtk4", features = ["v4_14"] }
adw = { version = "0.7.2", package = "libadwaita", features = ["v1_5"] }
glib = "0.20.9"
tokio = { version = "1.44", features = ["rt", "process", "time", "macros", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
anyhow = "1"
walkdir = "2.4"
nix = { version = "0.29", features = ["user", "fs"] }
async-channel = "2.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# ---------------------------------------------------------------------------
# Packaging Debian / Ubuntu / Pop!_OS (`cargo deb`)
# `ntfs-3g` fournit les outils `mkntfs` / `ntfsfix` sur Debian (ex-paquet
# `ntfsprogs`), tandis que sur Arch et Fedora les deux paquets sont distincts.
# ---------------------------------------------------------------------------
[package.metadata.deb]
maintainer = "Axel Valens <axel.valens@gmail.com>"
copyright = "2024-2026, Axel Valens"
license-file = ["LICENSE", "0"]
extended-description = "Créateur de clés USB bootables Linux (DD) et Windows UEFI, avec génération d'autounattend.xml et de scripts de debloat."
section = "utils"
priority = "optional"
# Sur Debian/Ubuntu, le paquet `ntfs-3g` fournit aussi `mkntfs`/`ntfsfix`
# (l'ancien paquet `ntfsprogs` a été fusionné dedans). L'alternative
# `ntfsprogs | ntfs-3g` satisfait donc la dépendance sur toutes les bases.
# Arch et Fedora exposent bien deux paquets distincts, déclarés dans le
# PKGBUILD et les métadonnées RPM.
depends = "$auto, libgtk-4-1 (>= 4.14.0), libadwaita-1-0 (>= 1.5.0), parted, dosfstools, ntfs-3g, ntfsprogs | ntfs-3g, pkexec | policykit-1, 7zip | p7zip-full"
recommends = "wimtools, 7zip, libfuse3-3"
assets = [
    ["target/release/noos-flasher", "usr/bin/", "755"],
    ["packaging/io.github.chomiam.NoosFlasher.desktop", "usr/share/applications/", "644"],
    ["assets/icons/noos-flasher-32.png", "usr/share/icons/hicolor/32x32/apps/io.github.chomiam.NoosFlasher.png", "644"],
    ["assets/icons/noos-flasher-64.png", "usr/share/icons/hicolor/64x64/apps/io.github.chomiam.NoosFlasher.png", "644"],
    ["assets/icons/noos-flasher-128.png", "usr/share/icons/hicolor/128x128/apps/io.github.chomiam.NoosFlasher.png", "644"],
    ["assets/icons/noos-flasher-256.png", "usr/share/icons/hicolor/256x256/apps/io.github.chomiam.NoosFlasher.png", "644"],
    ["assets/icons/noos-flasher-512.png", "usr/share/icons/hicolor/512x512/apps/io.github.chomiam.NoosFlasher.png", "644"],
    ["README.md", "usr/share/doc/noos-flasher/README.md", "644"],
    ["LICENSE", "usr/share/doc/noos-flasher/copyright", "644"],
]

# ---------------------------------------------------------------------------
# Packaging Fedora / RHEL / openSUSE (`cargo generate-rpm`)
# ---------------------------------------------------------------------------
[package.metadata.generate-rpm]
name = "noos-flasher"
summary = "Créateur de clés USB bootables Linux et Windows UEFI"
license = "MIT"
url = "https://github.com/Chomiam/noos-flasher"
assets = [
    { source = "target/release/noos-flasher", dest = "/usr/bin/noos-flasher", mode = "755" },
    { source = "packaging/io.github.chomiam.NoosFlasher.desktop", dest = "/usr/share/applications/io.github.chomiam.NoosFlasher.desktop", mode = "644" },
    { source = "assets/icons/noos-flasher-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/io.github.chomiam.NoosFlasher.png", mode = "644" },
    { source = "assets/icons/noos-flasher-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/io.github.chomiam.NoosFlasher.png", mode = "644" },
    { source = "assets/icons/noos-flasher-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/io.github.chomiam.NoosFlasher.png", mode = "644" },
    { source = "assets/icons/noos-flasher-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/io.github.chomiam.NoosFlasher.png", mode = "644" },
    { source = "assets/icons/noos-flasher-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/io.github.chomiam.NoosFlasher.png", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/noos-flasher/README.md", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/noos-flasher/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
gtk4 = ">= 4.14"
libadwaita = ">= 1.5"
parted = "*"
dosfstools = "*"
ntfs-3g = "*"
ntfsprogs = "*"
polkit = "*"
util-linux = "*"
