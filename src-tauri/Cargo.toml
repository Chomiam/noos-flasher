[package]
name = "noos-win-installer"
version = "0.1.2"
description = "Outil de création de clés USB bootables Linux (DD) et Windows UEFI avec Tauri v2"
authors = ["Chomiam <chomiam@users.noreply.github.com>"]
edition = "2021"
rust-version = "1.82"
license = "MIT"

[lib]
name = "noos_win_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1.0"
walkdir = "2.4"
chrono = { version = "0.4", features = ["serde"] }
nix = { version = "0.29", features = ["signal", "process", "fs", "user"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
