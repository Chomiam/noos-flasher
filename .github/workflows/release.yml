name: "Build & Release Noos Flasher (.deb, .rpm, .AppImage)"

on:
  push:
    branches:
      - testing
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version du tag de release (ex: v0.2.0)"
        required: true
        default: "v0.2.0"

permissions:
  contents: write

jobs:
  build-linux-bundles:
    name: "Compiler et empaqueter (.deb, .rpm, .AppImage)"
    runs-on: ubuntu-24.04
    steps:
      - name: "Récupération du dépôt"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Installation des dépendances système (GTK4, Libadwaita, outils USB/NTFS)"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libgirepository1.0-dev \
            librsvg2-dev \
            desktop-file-utils \
            patchelf \
            rpm \
            fakeroot \
            file \
            wget \
            curl \
            libfuse2t64 \
            parted \
            dosfstools \
            ntfs-3g \
            p7zip-full \
            policykit-1 \
            xdg-utils
          # Debian/Ubuntu : le paquet `ntfs-3g` fournit aussi mkntfs/ntfsfix
          # (l'ancien paquet `ntfsprogs` a été fusionné dedans).
          if apt-cache show ntfsprogs >/dev/null 2>&1; then
            sudo apt-get install -y ntfsprogs
          fi

      - name: "Configuration de la chaîne Rust Stable"
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: "Cache Cargo"
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: "Vérifications (format, Clippy, tests, dépendances runtime)"
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked
          for bin in pkexec parted mkfs.vfat mkfs.ntfs ntfsfix ntfs-3g; do
            command -v "$bin" >/dev/null || {
              echo "Dépendance runtime manquante : $bin" >&2
              exit 1
            }
          done

      - name: "Compilation release"
        run: cargo build --release --locked

      - name: "Installation des outils d'empaquetage"
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked

      - name: "Génération des paquets .deb et .rpm"
        run: |
          cargo deb --no-build --no-strip
          cargo generate-rpm

      - name: "Génération de l'AppImage (GTK4 + Libadwaita)"
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          DEPLOY_GTK_VERSION: "4"
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/32x32/apps
          mkdir -p AppDir/usr/share/icons/hicolor/64x64/apps
          mkdir -p AppDir/usr/share/icons/hicolor/128x128/apps
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps

          install -Dm755 target/release/noos-flasher AppDir/usr/bin/noos-flasher
          install -Dm644 packaging/io.github.chomiam.NoosFlasher.desktop \
            AppDir/usr/share/applications/io.github.chomiam.NoosFlasher.desktop
          install -Dm644 assets/icons/noos-flasher-32.png \
            AppDir/usr/share/icons/hicolor/32x32/apps/io.github.chomiam.NoosFlasher.png
          install -Dm644 assets/icons/noos-flasher-64.png \
            AppDir/usr/share/icons/hicolor/64x64/apps/io.github.chomiam.NoosFlasher.png
          install -Dm644 assets/icons/noos-flasher-128.png \
            AppDir/usr/share/icons/hicolor/128x128/apps/io.github.chomiam.NoosFlasher.png
          install -Dm644 assets/icons/noos-flasher-256.png \
            AppDir/usr/share/icons/hicolor/256x256/apps/io.github.chomiam.NoosFlasher.png
          install -Dm644 assets/icons/noos-flasher-512.png \
            AppDir/usr/share/icons/hicolor/512x512/apps/io.github.chomiam.NoosFlasher.png

          wget -q -c "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -q -c "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh"
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh

          LINUXDEPLOY="$PWD/linuxdeploy-x86_64.AppImage" \
          DEPLOY_GTK_VERSION=4 \
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin gtk --output appimage \
            --desktop-file AppDir/usr/share/applications/io.github.chomiam.NoosFlasher.desktop \
            --icon-file assets/icons/noos-flasher-512.png

      - name: "Collecte des artefacts et empreintes SHA-256"
        id: artifacts
        run: |
          mkdir -p release-assets
          cp target/debian/*.deb release-assets/ 2>/dev/null || cp target/*.deb release-assets/
          cp target/generate-rpm/*.rpm release-assets/
          cp ./*.AppImage release-assets/
          cd release-assets
          sha256sum *.deb *.rpm *.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v0.2.0"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: "Publication de la release GitHub"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifacts.outputs.TAG }}
          name: "Noos Flasher ${{ steps.artifacts.outputs.TAG }} — Linux (GTK4)"
          body: |
            ## Noos Flasher ${{ steps.artifacts.outputs.TAG }} — Créateur de clés USB bootables Linux & Windows UEFI

            Interface native **GTK4 / Libadwaita** (remplace le frontend Tauri v2), backend Rust conservé pour l'inspection ISO, l'écriture DD, le partitionnement Windows UEFI et le Debloat Studio.

            ### Dépendances livrées
            - **`ntfs-3g`** et **`ntfsprogs`** sont déclarés dans les paquets Arch (`PKGBUILD`), RPM et dans les prérequis Debian (où `ntfs-3g` fournit `mkntfs`/`ntfsfix`).
            - `parted`, `dosfstools`, `polkit` (`pkexec`) et `util-linux` restent requis.
            - `7z` est optionnel ; `wimlib-imagex` est embarqué dans le binaire.

            ### Paquets
            - Arch Linux (AUR) : `yay -S noos-flasher`
            - Debian / Ubuntu / Pop!_OS : `.deb`
            - Fedora / RHEL / openSUSE : `.rpm`
            - Universel : `.AppImage` (nécessite les outils système de l'hôte)
            - Empreintes : `SHA256SUMS.txt`
          files: |
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.AppImage
            release-assets/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
