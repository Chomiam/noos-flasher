name: "Build & Release Noos Flasher (.deb, .rpm, .AppImage)"

on:
  push:
    branches:
      - testing
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version du tag de release (ex: v0.1.2)"
        required: true
        default: "v0.1.2"

permissions:
  contents: write

jobs:
  build-linux-bundles:
    name: "Compiler et Empaqueter (.deb, .rpm, .AppImage)"
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Récupération du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Installation des dépendances système Linux (WebKit2GTK 4.1, RPM, AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            file \
            wget \
            curl \
            libfuse2t64 \
            ntfs-3g \
            desktop-file-utils \
            xdg-utils

      - name: 🟢 Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 🦀 Configuration de la chaîne Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: ⚡ Cache Cargo Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 📦 Installation du CLI Tauri v2
        run: npm install

      - name: 🔨 Compilation Tauri v2 (.deb, .rpm, .AppImage)
        env:
          NO_STRIP: true
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          npx tauri build --bundles deb,rpm,appimage

      - name: 📋 Collecte des paquets et calcul des empreintes SHA-256
        id: artifacts
        run: |
          mkdir -p release-assets
          cp src-tauri/target/release/bundle/deb/*.deb release-assets/
          cp src-tauri/target/release/bundle/rpm/*.rpm release-assets/
          cp src-tauri/target/release/bundle/appimage/*.AppImage release-assets/
          cd release-assets
          sha256sum *.deb *.rpm *.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v0.1.2"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: 🚀 Publication de la Release GitHub (.deb, .rpm, .AppImage)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifacts.outputs.TAG }}
          name: "Noos Flasher ${{ steps.artifacts.outputs.TAG }} — Linux (.deb, .rpm, .AppImage)"
          body: |
            ## ⚡ Noos Flasher ${{ steps.artifacts.outputs.TAG }} — Créateur de clés USB Bootables Linux & Windows UEFI

            Outil desktop natif **Rust + Tauri v2** pour Linux (Arch Linux, Pop!_OS, Ubuntu, Debian, Fedora) permettant de créer des clés USB bootables **Linux (Mode DD)** et **Windows 10/11 UEFI** avec studio de personnalisation et Debloat intégré.

            ### 🛠️ Nouveautés & Correctifs (${{ steps.artifacts.outputs.TAG }}) :
            - 🔐 **Correction de l'élévation PolicyKit (`pkexec`) en mode `.AppImage`** : extraction et vérification automatique du worker privilégié hors du point de montage FUSE utilisateur (`/tmp/.mount_*`, inaccessible en `root` via `EACCES`), nettoyage des variables d'environnement AppImage (`LD_LIBRARY_PATH`, `GIO_MODULE_DIR`) et isolation par UID de `wimtools` (`/tmp/noos_embedded_wimtools_<uid>`).
            - 🐧 **Support Arch Linux (AUR)** : ajout des métadonnées officielles `PKGBUILD` / `.SRCINFO` et publication sur l'Arch User Repository (`noos-win-installer`).
            - 🩹 **Correction du crash Windows 11 24H2/25H2 à 58 % (`specialize`)** : double injection XML (`<Extensions>`) + `$OEM$` garantissant l'extraction de `noos_debloat.ps1` et `noos_firstlogon.ps1` depuis `C:\Windows\Panther\unattend.xml` même avec une image découpée (`install.swm`).
            - 🔒 **Isolation stricte de `NTUSER.DAT` (`HKU\DefaultUser`)** : montage/démontage de la ruche profil par défaut dans des processus `RunSynchronousCommand` dédiés et écriture via `reg.exe add`, éliminant le verrouillage de `NTUSER.DAT` lors de la création du profil utilisateur.

            ### ✨ Fonctionnalités incluses :
            - 🛡️ **Protection stricte des disques système** : exclusion automatique de `/`, `/boot`, `/home` et des disques NVMe/SATA internes.
            - 🪟 **Mode Windows 10/11 UEFI autonome** : partitionnement GPT/MBR, formatage FAT32/NTFS et `wimlib-imagex` embarqué nativement dans le binaire pour le découpage automatique de `install.wim` (> 4 Gio) sans dépendance externe à installer.
            - 👤 **Compte Local & OOBE Bypass** : génération automatique de `/autounattend.xml` (`BypassNRO`, création du compte Administrateur local pré-configuré, bypass TPM 2.0 / Secure Boot / RAM).
            - 🧹 **Studio Debloat (22 patchs configurables)** : suppression de Microsoft Copilot, Windows Recall, Bing Search, Cortana, Widgets, OneDrive, bloatwares UWP, télémétrie `DiagTrack` et restauration du menu clic-droit classique Windows 10.
            - 🔐 **Élévation PolicyKit (`pkexec`)** : l'interface graphique s'exécute sans privilèges root et délègue uniquement l'écriture bloc au worker privilégié.

            ### 📦 Paquets disponibles :
            - **Arch Linux (AUR)** : `yay -S noos-win-installer` / `paru -S noos-win-installer`
            - **Debian / Ubuntu / Pop!_OS / Mint** : `.deb`
            - **Fedora / RHEL / openSUSE** : `.rpm`
            - **Universel Linux Portable** : `.AppImage`
            - **Empreintes de vérification** : `SHA256SUMS.txt`
          files: |
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.AppImage
            release-assets/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
